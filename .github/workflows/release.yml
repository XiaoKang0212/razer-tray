name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Binaries
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MinGW Toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils

      - name: Build razer-tray.exe (Standalone)
        shell: msys2 {0}
        run: |
          mkdir -p bin
          windres --codepage 65001 -I res -i res/app.rc -o bin/app.o
          g++ -O3 -mwindows -municode -s -static \
            src/main.cpp src/device_manager.cpp src/osd_window.cpp \
            src/tray_menu.cpp src/tray_icon.cpp bin/app.o \
            -lsetupapi -lhid -luser32 -lgdi32 -lshell32 -ladvapi32 \
            -luxtheme -ldwmapi -lmsimg32 \
            -o bin/razer-tray.exe
          rm -f bin/app.o

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: razer-tray
          path: bin/razer-tray.exe

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          heading="## ${GITHUB_REF_NAME}"
          awk -v heading="$heading" '
            $0 == heading { found=1; print; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: razer-tray ${{ github.ref_name }}
          body_path: release-notes.md
          files: bin/razer-tray.exe
